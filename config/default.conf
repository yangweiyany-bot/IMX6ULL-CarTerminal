# IMX6ULL-CarTerminal simulation configuration.
# These alarm thresholds are demonstration parameters only. They are not
# real vehicle diagnostic or safety standards.
data_source=simulator
run_mode=finite

low_voltage_threshold_v=12.55
high_temperature_threshold_c=40.0
overspeed_threshold_kmh=120.0

sample_count=10
sampling_interval_ms=100
queue_capacity=4

# Size-based rotation. The active file is renamed to .1, older generations
# shift upward, and generations beyond rotated_file_count are removed.
log_max_size_bytes=10485760
csv_max_size_bytes=52428800
rotated_file_count=5

# Relative paths are resolved from this configuration file's directory.
log_file=../runtime/car_terminal.log
csv_file=../runtime/vehicle_data.csv
