# IMX6ULL-CarTerminal synthetic SocketCAN example.
# This mapping is invented solely for vcan/software tests. It is not a real
# vehicle protocol, DBC, diagnostic definition, or safety standard.
data_source=socketcan
run_mode=finite

low_voltage_threshold_v=12.55
high_temperature_threshold_c=40.0
overspeed_threshold_kmh=120.0

sample_count=10
# In SocketCAN mode this is the minimum interval between complete samples.
sampling_interval_ms=1
queue_capacity=4

can_interface=vcan0
can_receive_timeout_ms=100
can_filters=standard:0x123:0x7FF

# Syntax:
# format:id:byte_offset:byte_length:byte_order:value_type:scale:value_offset
# Synthetic frame 0x123 layout:
# bytes 0..1 speed, little-endian unsigned, raw * 0.01 km/h
# bytes 2..3 temperature, little-endian signed, raw * 0.1 C
# bytes 4..5 voltage, big-endian unsigned, raw * 0.01 V
can_speed_mapping=standard:0x123:0:2:little:unsigned:0.01:0
can_temperature_mapping=standard:0x123:2:2:little:signed:0.1:0
can_voltage_mapping=standard:0x123:4:2:big:unsigned:0.01:0

log_file=../runtime/socketcan_car_terminal.log
csv_file=../runtime/socketcan_vehicle_data.csv
