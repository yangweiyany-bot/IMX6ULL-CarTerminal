# IMX6ULL-CarTerminal continuous simulation example.
# Generated samples and alarm thresholds are demonstrations only; they are not
# real vehicle data, diagnostic limits, or safety standards.
data_source=simulator
run_mode=continuous

low_voltage_threshold_v=12.55
high_temperature_threshold_c=40.0
overspeed_threshold_kmh=120.0

# Required for backward-compatible configuration parsing but ignored while
# run_mode=continuous. SIGINT or SIGTERM ends continuous monitoring.
sample_count=10
sampling_interval_ms=100
queue_capacity=4

log_max_size_bytes=10485760
csv_max_size_bytes=52428800
rotated_file_count=5

log_file=../runtime/continuous_car_terminal.log
csv_file=../runtime/continuous_vehicle_data.csv
